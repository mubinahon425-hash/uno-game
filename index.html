<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UNO Web App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #5c2c16;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* Игровой стол */
    .table-zone {
      margin-top: auto;
      margin-bottom: auto;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25);
      border: 4px dashed rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Карты */
    .card {
      width: 75px;
      height: 110px;
      border-radius: 10px;
      border: 3px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: absolute;
      cursor: grab;
    }

    /* Цвета карт */
    .card.red { background-color: #e74c3c; }
    .card.blue { background-color: #3498db; }
    .card.green { background-color: #2ecc71; }
    .card.yellow { background-color: #f1c40f; color: #333; }

    /* Карты на столе */
    .played-card {
      position: absolute;
      cursor: default;
      pointer-events: none;
    }

    /* Рука игрока */
    .hand-container {
      width: 100%;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 25px;
      position: relative;
    }
  </style>
</head>
<body>

  <h2 style="color: white; margin-top: 15px;">UNO Game</h2>

  <!-- Стол -->
  <div class="table-zone" id="tableZone">
    <div class="card blue played-card" style="transform: rotate(-5deg);">6</div>
  </div>

  <!-- Карты игрока -->
  <div class="hand-container" id="hand">
    <div class="card red" style="left: calc(50% - 120px);" data-color="red" data-val="1">1</div>
    <div class="card yellow" style="left: calc(50% - 70px);" data-color="yellow" data-val="5">5</div>
    <div class="card green" style="left: calc(50% - 20px);" data-color="green" data-val="0">0</div>
    <div class="card green" style="left: calc(50% + 30px);" data-color="green" data-val="+1">+1</div>
    <div class="card blue" style="left: calc(50% + 80px);" data-color="blue" data-val="2">2</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const tableZone = document.getElementById('tableZone');
    const cards = document.querySelectorAll('#hand .card');

    cards.forEach(card => {
      let isDragging = false;
      let startX, startY;
      let originalLeft = card.offsetLeft;
      let originalTop = card.offsetTop;

      // Нажатие на карту
      card.addEventListener('mousedown', startDrag);
      card.addEventListener('touchstart', startDrag, { passive: false });

      function startDrag(e) {
        isDragging = true;
        card.style.zIndex = 1000;
        card.style.transition = 'none';

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        startX = clientX - card.offsetLeft;
        startY = clientY - card.offsetTop;

        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);
      }

      // Перемещение
      function onMove(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        card.style.left = (clientX - startX) + 'px';
        card.style.top = (clientY - startY) + 'px';
      }

      // Отпускание карты
      function stopDrag(e) {
        if (!isDragging) return;
        isDragging = false;

        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchend', stopDrag);

        const cardRect = card.getBoundingClientRect();
        const tableRect = tableZone.getBoundingClientRect();

        // Проверка попадания на стол
        const isOverTable = !(
          cardRect.right < tableRect.left ||
          cardRect.left > tableRect.right ||
          cardRect.bottom < tableRect.top ||
          cardRect.top > tableRect.bottom
        );

        if (isOverTable) {
          // Создаем карту на столе
          const newPlayedCard = document.createElement('div');
          newPlayedCard.className = `card ${card.dataset.color} played-card`;
          newPlayedCard.textContent = card.dataset.val;

          const randomRotate = Math.floor(Math.random() * 30) - 15;
          newPlayedCard.style.transform = `rotate(${randomRotate}deg)`;

          tableZone.appendChild(newPlayedCard);
          card.remove();

          if (tg) {
            tg.sendData(JSON.stringify({
              action: "play_card",
              color: card.dataset.color,
              value: card.dataset.val
            }));
          }
        } else {
          // Возврат карты на место
          card.style.transition = 'all 0.2s ease';
          card.style.left = originalLeft + 'px';
          card.style.top = originalTop + 'px';
          card.style.zIndex = 1;
        }
      }
    });
  </script>
</body>
</html>
